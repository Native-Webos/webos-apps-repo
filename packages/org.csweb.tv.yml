description: |
  CSWeb TV is a native LG webOS application with a C++ television interface and
  a bundled Android Runtime for running supported CloudStream extensions locally.
  It provides remote-control navigation, provider browsing and search, native
  playback, subtitles, audio tracks, bookmarks, watch history and local profiles.

  The application ships no content, extensions or extension repositories.
  Users add their own trusted sources. Only use content you are authorized to access.

  ## Compatibility

  This listing distributes the main package, `org.csweb.tv`. Its native UI uses the
  webOS ARM userland ABI, but its bundled AArch64 plugin runtime requires a **64-bit
  kernel**. It also requires firmware providing `libcurl.so.4`, normally available
  on webOS 5.3.1 and later. A TV with a 32-bit kernel cannot run this package's
  plugin runtime, even though the IPK filename ends in `_arm.ipk`.

  The project's reference device is an LG OLED65C1PTB running webOS 6.5.3.
  This is not a guarantee of compatibility with every TV or extension.
  Developer Mode installation does not require root; keep its session active.
  The experimental legacy package is not included in this listing.

  ## Known limitations

  Extensions requiring WebView or Android-specific screens are not supported.
  Torrent/magnet playback, Widevine/PlayReady, video downloads and online account
  synchronization are unavailable. A provider loading successfully does not
  guarantee search, link extraction or playback will work.

  Built with the [Native-Webos Native App Kit](https://github.com/Native-Webos/webos-native-app-kit).
  See the [project documentation](https://github.com/sostk/cloudstream-webos-native)
  for installation, licensing, troubleshooting and device compatibility reports.

  ## Source and support

  - [Source code and build instructions](https://github.com/sostk/cloudstream-webos-native).
  - [Report a bug or playback issue](https://github.com/sostk/cloudstream-webos-native/issues/new).
  - [Report a working or failing TV](https://github.com/sostk/cloudstream-webos-native/discussions/14).
  - [Device reporting guide](https://github.com/sostk/cloudstream-webos-native/blob/main/docs/compatibility.md).

  Please report issues as well as successful playback. Include your TV model,
  webOS and firmware versions, app version, package variant, extension version,
  steps to reproduce and the result of each tested operation. Attach `events.log`
  and, when available, `runtime.log` from `/tmp/org.csweb.tv/` before rebooting.
  Remove credentials, tokens and private stream URLs from logs and screenshots.

  The screenshot is a host preview from the project's 0.1 development series;
  appearance on a TV or in newer releases may differ.
