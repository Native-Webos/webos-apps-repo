shortDescription: Native CloudStream client for older LG TVs with an ARM32 kernel.
description: |
  CSWeb TV Legacy is the native application variant for older LG webOS TVs with
  a 32-bit ARM kernel, including webOS 4.x devices. It bundles an ARMv7 Android
  Runtime for supported CloudStream extensions and its own libcurl/mbedTLS HTTP
  transport instead of requiring the main package's firmware libcurl.

  The app ships no content, extensions or extension repositories. Add your own
  trusted sources and only access content you are authorized to use.

  ## Choose the right package

  Install Legacy (`org.csweb.tv.legacy`) when your TV has a 32-bit kernel such as
  `armv7l`, or the main package reports `runtime: exited (code 127)` or
  `no HTTP transport`. The main package (`org.csweb.tv`) requires a 64-bit kernel
  for its AArch64 runtime. A filename ending in `_arm.ipk` does not distinguish
  these runtime architectures.

  Main and Legacy have separate app IDs, settings, plugins and logs, and can
  coexist. Developer Mode installation does not require root; keep its session
  active. Built with the [Native-Webos Native App Kit](https://github.com/Native-Webos/webos-native-app-kit).

  ## Compatibility and limitations

  Legacy support is experimental. Compatibility depends on the TV's kernel,
  firmware libraries, available memory, extension APIs and media formats.
  No universal minimum webOS version or compatibility with every older ARM32 TV
  is claimed. A successful install or native ARM CI run does not establish
  successful extension loading or playback on a particular TV.

  Older TVs may start slowly or have limited memory. Extensions requiring
  WebView or Android-specific screens, torrent/magnet playback, Widevine/PlayReady,
  video downloads and online account synchronization are not supported.

  ## Source and support

  - [Source code and build instructions](https://github.com/sostk/cloudstream-webos-native).
  - [Legacy requirements and troubleshooting](https://github.com/sostk/cloudstream-webos-native/blob/main/docs/legacy-build.md).
  - [Report a bug or playback issue](https://github.com/sostk/cloudstream-webos-native/issues/new).
  - [Report a working or failing TV](https://github.com/sostk/cloudstream-webos-native/discussions/14).
  - [Device reporting guide](https://github.com/sostk/cloudstream-webos-native/blob/main/docs/compatibility.md).

  Please report issues as well as successful tests. Include the TV model,
  webOS/firmware versions, kernel architecture when known, app version,
  **Legacy** variant, extension version and steps/results for each tested feature.
  Collect `events.log` and, when available, `runtime.log` from
  `/tmp/org.csweb.tv.legacy/` before rebooting. Remove credentials, tokens and
  private stream URLs from logs and screenshots.
